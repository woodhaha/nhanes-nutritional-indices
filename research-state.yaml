project:
  name: NHANES Nutrition + Cognition + Depression
  question: >
    In US adults ≥60, what is the association between multi-index nutritional status
    (DII/PNI/CONUT/GNRI) and cognitive function, and does depression mediate this relationship?
  status: concluding
  completed_arms:
    gi_cancer: true
    cognition_baseline: true
    mediation_all_indices: true
    composite_score: true
    ckd_stratification: true

literature:
  status: complete
  papers_reviewed: 22  # added CKD-cognition papers

hypotheses:
  - id: H1
    status: partially_supported
    result: "CONUT strongest (β=0.052, p=0.001), E-DII (β=0.040, p=0.034)"
  - id: H2
    status: index_dependent
    result: "PNI (9.2%) and GNRI (9.1%) mediate via depression. DII/CONUT do not."
  - id: H3
    status: superseded_by_composite
  - id: H4
    status: inconclusive
  - id: H5
    status: supported
    result: "CKD does NOT confound — eGFR adjustment leaves β unchanged"
  - id: H6
    status: supported
    result: "Composite (All 4) β=0.105, ΔR²=0.0073 — nearly 2× single indices"

inner_loop:
  experiments_completed: 4
  trajectory:
    - "Baseline: all 4 indices → cognition"
    - "Depression mediation: PNI/GNRI mediated, DII/CONUT not"
    - "Composite score: All-4 composite β=0.105 (strongest)"
    - "CKD: eGFR does not confound"

outer_loop:
  direction: conclude
  rationale: >
    Four novel findings with clear narrative for a brief report:
    1. CONUT strongest single predictor (objective > dietary)
    2. Depression selectively mediates albumin-based indices
    3. Multi-index composite outperforms single indices
    4. CKD does not confound (strengthens validity)
    Ready for paper writing.
